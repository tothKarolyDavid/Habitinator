version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      dotnet:
        patterns:
          - "*"
