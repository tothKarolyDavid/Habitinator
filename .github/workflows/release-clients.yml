name: Release MAUI clients

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-clients-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false


env:
  DOTNET_NO_LOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  resolve-production-url:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Same GitHub Environment as deploy-azure-web so the OIDC subject is
    # repo:OWNER/REPO:environment:production, one Entra federated credential for CI and tag releases.
    environment: production
    outputs:
      api_base_url: ${{ steps.resolve.outputs.api_base_url }}
      web_url: ${{ steps.resolve.outputs.web_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate Azure OIDC variables
        if: ${{ vars.PRODUCTION_API_BASE_URL == '' && vars.AZURE_CLIENT_ID != '' }}
        env:
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          test -n "${TENANT_ID}" || { echo "::error::Set AZURE_TENANT_ID when AZURE_CLIENT_ID (OIDC) is set."; exit 1; }
          test -n "${SUBSCRIPTION_ID}" || { echo "::error::Set AZURE_SUBSCRIPTION_ID when AZURE_CLIENT_ID (OIDC) is set."; exit 1; }

      - name: Azure login (discover web app URL)
        if: ${{ vars.PRODUCTION_API_BASE_URL == '' }}
        uses: ./.github/actions/azure-login
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve production API and web base URLs
        id: resolve
        env:
          MANUAL_API: ${{ vars.PRODUCTION_API_BASE_URL }}
          MANUAL_WEB: ${{ vars.PRODUCTION_WEB_URL }}
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_RG_VAR: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          trim_slash() { echo -n "$1" | sed 's:/*$::'; }
          if [ -n "${MANUAL_API}" ]; then
            api="$(trim_slash "$MANUAL_API")"
            if [ -n "${MANUAL_WEB}" ]; then
              web="$(trim_slash "$MANUAL_WEB")"
            else
              web="$api"
            fi
            echo "api_base_url=$api" >> "$GITHUB_OUTPUT"
            echo "web_url=$web" >> "$GITHUB_OUTPUT"
            echo "Using repository variables PRODUCTION_API_BASE_URL / PRODUCTION_WEB_URL."
            exit 0
          fi
          if [ -z "${AZURE_ENV_NAME}" ]; then
            echo "Either set PRODUCTION_API_BASE_URL, or set AZURE_ENV_NAME plus Azure auth (OIDC variables or AZURE_CREDENTIALS secret) to discover the App Service."
            exit 1
          fi
          RG="${AZURE_RG_VAR:-}"
          if [ -z "${RG}" ]; then RG="rg-${AZURE_ENV_NAME}"; fi
          echo "Resolving App Service in resource group: $RG (azd-env-name=$AZURE_ENV_NAME)"
          if [ -n "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]; then
            az account set --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          fi
          NAMES="$(az resource list -g "$RG" --resource-type "Microsoft.Web/sites" \
            --query "[?tags.\"azd-env-name\"=='${AZURE_ENV_NAME}' && tags.\"azd-service-name\"=='web'].name" -o tsv || true)"
          if [ -z "${NAMES}" ]; then
            echo "No Microsoft.Web/sites in '$RG' with tags azd-env-name='${AZURE_ENV_NAME}' and azd-service-name='web'."
            echo "Set PRODUCTION_API_BASE_URL, or fix AZURE_RESOURCE_GROUP / AZURE_ENV_NAME."
            exit 1
          fi
          NAME="$(echo "$NAMES" | head -1)"
          HOST="$(az webapp show -g "$RG" -n "$NAME" --query defaultHostName -o tsv)"
          if [ -z "${HOST}" ]; then
            echo "Could not read defaultHostName for web app '$NAME'."
            exit 1
          fi
          url="https://${HOST}"
          echo "api_base_url=$url" >> "$GITHUB_OUTPUT"
          echo "web_url=$url" >> "$GITHUB_OUTPUT"
          echo "Resolved from Azure: $url"

  build-android:
    needs: [resolve-production-url]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            11.0.x
          dotnet-quality: 'preview'

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Prepare MAUI release API config
        shell: bash
        env:
          API_BASE_URL: ${{ needs.resolve-production-url.outputs.api_base_url }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          api = os.environ["API_BASE_URL"].rstrip("/")
          tpl = Path("src/App.MAUI/appsettings.Release.template.json").read_text(encoding="utf-8")
          Path("src/App.MAUI/appsettings.Release.json").write_text(
              tpl.replace("__API_BASE_URL__", api), encoding="utf-8"
          )
          PY

      - name: Build Android APK (Release, unsigned)
        shell: bash
        run: |
          dotnet publish src/App.MAUI/App.MAUI.csproj \
            -f net11.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk

      - name: Collect Android artifacts
        shell: bash
        run: |
          mkdir -p artifacts/android
          APK="$(ls -1 src/App.MAUI/bin/Release/net11.0-android/*-Signed.apk 2>/dev/null | head -1 || true)"
          if [ -z "$APK" ]; then APK="$(ls -1 src/App.MAUI/bin/Release/net11.0-android/*.apk | head -1)"; fi
          cp "$APK" "artifacts/android/Habitinator-android.apk"
          (cd artifacts/android && sha256sum "Habitinator-android.apk" > "Habitinator-android.apk.sha256")

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            artifacts/android/Habitinator-android.apk
            artifacts/android/Habitinator-android.apk.sha256

  build-windows:
    needs: [resolve-production-url]
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            11.0.x
          dotnet-quality: 'preview'

      - name: Install MAUI workload
        shell: pwsh
        run: dotnet workload install maui

      - name: Prepare MAUI release API config
        shell: pwsh
        env:
          API_BASE_URL: ${{ needs.resolve-production-url.outputs.api_base_url }}
        run: |
          $apiBaseUrl = $env:API_BASE_URL.TrimEnd("/")
          $template = Get-Content "src/App.MAUI/appsettings.Release.template.json" -Raw
          $template.Replace("__API_BASE_URL__", $apiBaseUrl) | Set-Content "src/App.MAUI/appsettings.Release.json"

      - name: Publish Windows app (Release)
        shell: pwsh
        run: >
          dotnet publish src/App.MAUI/App.MAUI.csproj
          -f net11.0-windows10.0.19041.0
          -c Release
          -p:WindowsPackageType=None
          -o artifacts/windows/publish

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/windows/publish/* -DestinationPath artifacts/windows/Habitinator-windows-x64.zip -Force
          $hash = Get-FileHash artifacts/windows/Habitinator-windows-x64.zip -Algorithm SHA256
          "$($hash.Hash.ToLower())  Habitinator-windows-x64.zip" | Set-Content artifacts/windows/Habitinator-windows-x64.zip.sha256

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build Windows Installer
        shell: pwsh
        run: iscc /dMyAppVersion="${{ github.ref_name }}" scripts/windows-installer.iss

      - name: Hash Windows Installer
        shell: pwsh
        run: |
          $hash = Get-FileHash artifacts/windows/Habitinator-windows-x64-setup.exe -Algorithm SHA256
          "$($hash.Hash.ToLower())  Habitinator-windows-x64-setup.exe" | Set-Content artifacts/windows/Habitinator-windows-x64-setup.exe.sha256

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            artifacts/windows/Habitinator-windows-x64-setup.exe
            artifacts/windows/Habitinator-windows-x64-setup.exe.sha256
            artifacts/windows/Habitinator-windows-x64.zip
            artifacts/windows/Habitinator-windows-x64.zip.sha256

  publish-release:
    needs: [resolve-production-url, build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-release
          path: artifacts/android

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: artifacts/windows

      - name: Build release notes
        shell: bash
        env:
          WEB_URL: ${{ needs.resolve-production-url.outputs.web_url }}
          API_URL: ${{ needs.resolve-production-url.outputs.api_base_url }}
        run: |
          cat > release-notes.md <<EOF
          ## Downloads
          - Android APK: \`Habitinator-android.apk\`
          - Windows Installer: \`Habitinator-windows-x64-setup.exe\` (Recommended for auto-updates)
          - Windows Portable: \`Habitinator-windows-x64.zip\`
          - Checksums: included as \`.sha256\` files

          ## Hosted web app
          ${WEB_URL}

          ## Notes
          - MAUI builds in this release are configured for API base URL: \`${API_URL}\`
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          body_path: release-notes.md
          files: |
            artifacts/android/Habitinator-android.apk
            artifacts/android/Habitinator-android.apk.sha256
            artifacts/windows/Habitinator-windows-x64-setup.exe
            artifacts/windows/Habitinator-windows-x64-setup.exe.sha256
            artifacts/windows/Habitinator-windows-x64.zip
            artifacts/windows/Habitinator-windows-x64.zip.sha256
